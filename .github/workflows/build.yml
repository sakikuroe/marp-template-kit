name: Build slides

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slides-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax and help
        run: |
          bash -n scripts/*.sh
          ./scripts/build.sh --help
          ./scripts/serve.sh --help
          ./scripts/render-diagram.sh --help
      - name: Install build and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman poppler-utils
      - name: Build components and samples
        run: |
          : > build.log
          for input in samples/*.md; do
            ./scripts/build.sh "$input" 2>&1 | tee -a build.log
          done
          if grep -E '^\[(mermaid|matplotlib)\]' build.log; then
            echo 'Diagram rendering failed.' >&2
            exit 1
          fi
      - name: Render standalone diagrams
        run: |
          ./scripts/render-diagram.sh samples/release-process.mmd
          ./scripts/render-diagram.sh --page 22 samples/diagram-gallery.drawio
          ./scripts/render-diagram.sh --background 'rgba(20,80,160,0.25)' --png-width 701 --no-embed-fonts --output out/diagrams/rgba samples/release-process.mmd
          test -s out/diagrams/release-process/release-process.svg
          test -s out/diagrams/release-process/release-process.png
          test -s out/diagrams/diagram-gallery/diagram-gallery-22.svg
          test -s out/diagrams/diagram-gallery/diagram-gallery-22.png
          podman run --rm --network=none -v "$PWD:/app:ro" --entrypoint python3 localhost/marp-template-kit/tools -c '
          from PIL import Image
          image = Image.open("/app/out/diagrams/rgba/release-process.png")
          assert image.width == 701
          pixel = image.convert("RGBA").getpixel((0, 0))
          assert all(abs(a-b) <= 1 for a,b in zip(pixel, (20,80,160,64))), pixel
          svg = open("/app/out/diagrams/rgba/release-process.svg").read()
          assert "@font-face" not in svg and "data:font" not in svg
          '
      - name: Verify selectable PDF text
        run: |
          for pdf in out/pdfs/*.pdf; do
            pdfinfo "$pdf"
            pdftotext "$pdf" "${pdf%.pdf}.txt"
            test -s "${pdf%.pdf}.txt"
          done
          grep -F '基本的なコンテンツ' out/pdfs/components.txt
      - name: Upload PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slide-pdfs
          path: out/pdfs/*.pdf
          if-no-files-found: error
          retention-days: 14
