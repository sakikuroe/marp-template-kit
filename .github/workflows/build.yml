name: Build slides

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slides-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax and help
        run: |
          bash -n scripts/*.sh
          ./scripts/build.sh --help
          ./scripts/serve.sh --help
          ./scripts/render-mermaid.sh --help
          ./scripts/render-drawio.sh --help
      - name: Install build and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman poppler-utils
      - name: Build components and samples
        run: |
          : > build.log
          for input in samples/*.md; do
            ./scripts/build.sh "$input" 2>&1 | tee -a build.log
          done
          if grep -E '^\[(mermaid|matplotlib)\]' build.log; then
            echo 'Diagram rendering failed.' >&2
            exit 1
          fi
      - name: Verify selectable PDF text
        run: |
          for pdf in out/pdfs/*.pdf; do
            pdfinfo "$pdf"
            pdftotext "$pdf" "${pdf%.pdf}.txt"
            test -s "${pdf%.pdf}.txt"
          done
          grep -F '基本的なコンテンツ' out/pdfs/components.txt
      - name: Upload PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slide-pdfs
          path: out/pdfs/*.pdf
          if-no-files-found: error
          retention-days: 14
